name: Spokn
description: >-
  Spokn is an AI-powered short-form video creation platform built for internal
  communications, HR, and learning & development teams. It lets organizations
  collect selfie, full-screen, or screen-share clips from employees across
  desktop and mobile, then stitch, trim, caption, translate (15 languages),
  and brand them into polished employee videos in under 30 minutes without
  video-editing expertise. Finished videos distribute via intranet, LMS,
  Microsoft Teams, Slack, email, or MP4 export. Spokn integrates with common
  HRIS (BambooHR, Workday, Zenefits, ADP, Rippling), SSO (Okta, OneLogin,
  G Suite), and Slack, but does not currently publish a public developer API,
  API reference, or developer portal. Backed by 500 Global.
